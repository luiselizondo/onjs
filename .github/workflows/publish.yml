name: Publish to npm
run-name: Publishing onjs ${{ github.ref_name }} to npm

on:
  workflow_dispatch:
  push:
    branches:
      - v3

# npm Trusted Publishing: the package is configured on npmjs.com to trust
# this repository + workflow filename, so publishing authenticates via OIDC
# (no NPM_TOKEN required). Requires npm >= 11.5.1 (Node 24 ships it).
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    # The job runs in a container so the services are reachable by their
    # hostnames ("rabbitmq", "redis") - on VM runners services are only
    # reachable via localhost:mapped-port. Node 24 ships npm >= 11.5.1,
    # required for OIDC trusted publishing.
    container: node:24-bookworm
    runs-on: ubuntu-latest
    services:
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        env:
          RABBITMQ_DEFAULT_USER: rabbitmq
          RABBITMQ_DEFAULT_PASS: rabbitmq
          RABBITMQ_DEFAULT_VHOST: /
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:alpine
        ports:
          - 19379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
      - name: Installing dependencies
        run: npm ci
      - name: Testing
        run: npm test
      - name: Check if this version is already published
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "onjs@$VERSION" version > /dev/null 2>&1; then
            echo "This version ($VERSION) is already on npm, skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publishing to NPM
        # v3 is the `latest` line: plain publish keeps the latest dist-tag on 3.x.
        # The v2 branch publishes with `--tag v2` so it never moves latest backwards.
        if: steps.version.outputs.publish == 'true'
        run: npm publish
