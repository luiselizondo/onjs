name: GitHub Actions
run-name: ${{ github.actor }} is testing and building changes
on: 
  workflow_dispatch:
  push:
    branches:
      - v3
  pull_request:
    branches:
      - '**'
  release:
    types: [published]

permissions:
  contents: read
  pull-requests: read
  id-token: write

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  test:
    # This job runs on pull requests and push to the v3 branch
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/v3')
    runs-on: ubuntu-latest
    container: node:22-bullseye
    services:
      redis:
        image: redis:alpine
        ports:
          - 19379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports:
          - 5672:5672
        env:
          RABBITMQ_ERLANG_COOKIE: SWQOKODSQALRPCLNMEQG
          RABBITMQ_DEFAULT_USER: rabbitmq
          RABBITMQ_DEFAULT_PASS: rabbitmq
          RABBITMQ_DEFAULT_VHOST: /
        options: >-
          --health-cmd "rabbitmq-diagnostics -q check_running && rabbitmq-diagnostics -q check_port_connectivity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - run: echo "The name of your branch is ${{ github.ref }} and your repository is ${{ github.repository }}."
      - name: Check out repository code
        uses: actions/checkout@v4
      
      - run: echo "The ${{ github.repository }} repository has been cloned to the runner."
      - run: echo "The workflow is now ready to test your code on the runner."

      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Installing dependencies
        run: npm ci

      - name: Testing
        run: npm test
      
      - run: echo "Job's status is ${{ job.status }}."
